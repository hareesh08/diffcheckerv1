name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps (npm)
        run: npm ci
        working-directory: ui

      - name: Clean UI build output
        run: rm -rf ui/dist

      - name: Build React UI (static SPA)
        run: npm run build
        working-directory: ui

      - name: Inspect UI build output
        run: |
          echo "--- ui/dist tree ---"
          find ui/dist -type f | sort
          echo "--- ui/dist/index.html ---"
          cat ui/dist/index.html | head -25
          if [ ! -s ui/dist/index.html ]; then
            echo "::error::ui/dist/index.html missing or empty after npm build"
            exit 1
          fi
          if grep -q "UI_NOT_BUILT" ui/dist/index.html; then
            echo "::error::Placeholder ui/dist/index.html still present — real build did not land"
            exit 1
          fi
          echo "OK: real UI build present"

      # rsrc must be built for the HOST (linux) so the runner can execute it.
      # Building it under the GOOS=windows env below would produce a Windows exe
      # that fails with "exec format error" when the runner tries to run it.
      - name: Install rsrc (host build)
        run: go install github.com/akavel/rsrc@v0.10.2

      - name: Build single windows binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          "$(go env GOPATH)/bin/rsrc" -ico app.ico -o app.syso
          go build -trimpath -o differ-pro.exe .
        working-directory: .

      - name: Verify embedded UI present
        run: |
          if strings differ-pro.exe | grep -q "UI_NOT_BUILT"; then
            echo "::error::Placeholder UI embedded in binary"
            exit 1
          else
            echo "OK: real UI embedded"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: differ-pro-windows
          path: differ-pro.exe
          if-no-files-found: error
