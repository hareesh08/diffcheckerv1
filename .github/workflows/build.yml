name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI deps (bun)
        run: bun install
        working-directory: ui

      - name: Build React UI (static SPA)
        run: bun run build
        working-directory: ui

      - name: Build single binary
        run: go build -trimpath -o diffchecker.exe .
        working-directory: .

      - name: Verify embedded UI present
        run: |
          if strings diffchecker.exe | grep -q "UI_NOT_BUILT"; then
            echo "::error::Placeholder UI embedded — bun build did not overwrite ui/dist/index.html"
            exit 1
          else
            echo "OK: real UI embedded"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffchecker-windows
          path: diffchecker.exe
          if-no-files-found: error
